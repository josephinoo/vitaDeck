[package]
name = "vita_deck"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
egui = "0.31"
fluent-bundle = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
sdl2 = { version = "0.38", features = ["use-pkgconfig", "unsafe_textures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unic-langid = "0.9"
webpki-roots = "0.26"

[target.'cfg(target_os = "vita")'.dependencies]
vita-newlib-shims = "0.3"
vitasdk-sys = { version = "0.3.3", features = [
    "SceCtrl_stub",
    "SceTouch_stub",
    "ScePower_stub",
    "SceRtc_stub",
    "SceAudio_stub",
    "SceAudiodec_stub",
    "SceIofilemgr_stub",
    "SceLibKernel_stub",
    "SceKernelThreadMgr_stub",
    "SceNet_stub",
    "SceNetCtl_stub",
    "SceSysmodule_stub",
    "SceAppMgr_stub",
    "SceGxm_stub",
    "SceDisplay_stub",
    "SceAvPlayer_stub",
    "SceCommonDialog_stub",
    "SceIme_stub",
] }

[build-dependencies]
cc = "1.0"

[patch.crates-io]
ring = { git = "https://github.com/vita-rust/ring.git", branch = "v0.17.14-vita" }

[package.metadata.vita]
title_id = "VITADECK1"
title_name = "VitaDeck"
assets = "assets"
vita_make_fself_flags = []

[profile.release]
lto = "fat"
codegen-units = 1
